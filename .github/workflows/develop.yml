name: "DEV DEPLOY"

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: "arn:aws:iam::992382535040:role/github-actions-rauansm"
      aws-region: "us-east-1"
      aws-statefile-s3-bucket: "github-actions-statefile-rauansm"
      aws-lock-dynamodb-table: "github-actions-lock-rauansm"